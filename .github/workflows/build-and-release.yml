name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package CleanSlate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CleanSlate.sln

      - name: Build Solution (Release)
        run: dotnet build CleanSlate.sln -c Release --no-restore

      - name: Build and Package Installer & Portable Package
        shell: pwsh
        run: |
          dotnet publish CleanSlate/CleanSlate.csproj -c Release -o dist/app
          dotnet publish CleanSlate.Settings/CleanSlate.Settings.csproj -c Release -o dist/app
          Compress-Archive -Path dist/app/* -DestinationPath installer/src/CleanSlate.Installer/payload.zip -CompressionLevel Optimal -Force
          dotnet publish installer/src/CleanSlate.Installer/CleanSlate.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
          Compress-Archive -Path dist/app/* -DestinationPath dist/CleanSlate-Portable.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanSlate-Release-Binaries
          path: |
            dist/CleanSlate-Setup.exe
            dist/CleanSlate-Portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CleanSlate-Setup.exe
            dist/CleanSlate-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
